[project]
name = "missing-regulation-ladder"
version = "0.1.0"
description = "Does cis-eQTL discovery at schizophrenia constrained/SCHEMA genes recover as brain cell-type resolution increases?"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Core table handling. parquet is the interchange format between stages,
    # matching the upstream prioritization pipeline.
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    # Binomial confidence intervals (Wilson / Clopper-Pearson) and the
    # contingency tests behind the recovery curve.
    "scipy>=1.13",
    # Benjamini-Hochberg and Benjamini-Yekutieli correction across genes and
    # rungs, plus proportion_confint for the recovery fractions.
    "statsmodels>=0.14",
    # Dataset fetching. Every download is recorded with its date and sha256.
    "requests>=2.31",
    # Dashboard. The report specifies Streamlit + Plotly for this project,
    # where the upstream repo used Altair.
    "streamlit>=1.60",
    "plotly>=5.22",
    # Static figures for the methods note and the Stage 1 report. The dashboard
    # uses Plotly; matplotlib is here only to write PNGs that live in docs/.
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
